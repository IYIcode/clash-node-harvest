name: harvest-subscription

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      threshold:
        description: 延迟阈值(ms)
        default: "800"
        required: false

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 下载 mihomo 内核
        run: |
          set -euo pipefail
          REL=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest || echo '{}')
          URL=$(echo "$REL" | jq -r '[.assets[]?.browser_download_url
                 | select(test("mihomo-linux-amd64-v[0-9.]+\\.gz$"))][0] // empty')
          if [ -z "$URL" ]; then
            echo "release API 未取到，回退到固定版本"
            URL="https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-linux-amd64-v1.19.31.gz"
          fi
          echo "kernel: $URL"
          curl -fsSL "$URL" | gunzip > mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: 采集 + 测活 + 生成订阅
        env:
          MIHOMO_BIN: ./mihomo
          THRESHOLD: ${{ github.event.inputs.threshold }}
        run: |
          # 阈值放宽：美国 runner 只能证明"全球可达"。实测这份清单在国内 0/356 过不了 HTTPS
          # 探测（最低延迟那批直接 RST），所以它只是跨设备备用池，日常订阅用本机 run_local.cmd。
          python harvest.py \
            --rounds 2 \
            --threshold "${THRESHOLD:-2500}" \
            --timeout 6000 \
            --max-nodes 2500 \
            --concurrency 64

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subscription
          path: output/
          if-no-files-found: ignore
          retention-days: 7

      - name: 推送到 sub 分支
        run: |
          set -euo pipefail
          if [ ! -s output/clash.yaml ]; then
            echo "没有生成订阅，保留 sub 分支上的旧版本"; exit 0
          fi
          cd output
          git init -q .
          git checkout -qb sub
          git config user.name "github-actions[bot]"
          git config user.email "41986344+github-actions[bot]@users.noreply.github.com"
          git add clash.yaml stats.json
          git commit -qm "update $(date -u +%Y-%m-%d\ %H:%M\ UTC)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:sub
          echo "备用池地址(仅全球可达，国内请用本机 run_local.cmd): https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/sub/clash.yaml"
